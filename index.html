<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pokémon Sleep Tools</title>

  <!-- CSS -->
  <link rel="stylesheet" href="tools/src_common/basic.css">
  <link rel="stylesheet" href="src/top.css">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
</head>
<body>

<!-- ▼ 固定ヘッダー -->
<header class="header">
  <div class="header-title">Pokémon Sleep Tools</div>
  <button id="menu-button" class="menu-button" type="button" aria-label="メニューを開く" aria-controls="side-Menu" aria-expanded="false">
    <span class="menu-line"></span>
    <span class="menu-line"></span>
    <span class="menu-line"></span>
  </button>
</header>

<!-- ▼ スライドメニュー -->
<nav class="side-menu" id="side-menu">
  <div class="menu-header">メニュー</div>

  <div class="menu-body">
    <a href="tools/detail.html">詳細評価</a>
    <a href="tools/compare.html">比較評価</a>
    <a href="tools/party.html">パーティ評価</a>
    <a href="tools/exp.html">Exp計算</a>
    <a href="tools/sleepPower.html">ねむけパワー算出</a>
    <a href="tools/database.html">データベース</a>
  </div>

  <div class="menu-bottom">
    <a href="index.html">トップページ</a>
  </div>
</nav>

<div class="overlay" id="overlay"></div>

<main>

  <h1>評価ツールまとめ</h1>

  <!-- ▼ ツール一覧 -->
  <section id="tools">
    <h2>ツール一覧</h2>
    <div id="toolGrid" class="grid"></div>
  </section>

  <!-- ▼ 更新履歴 -->
  <section id="history" class="panel chalkboard">
    <h2>更新履歴</h2>

    <table id="historyTable">
      <thead>
        <tr>
          <th>日付</th>
          <th>
            <div class="filter-box">
              <label>ツール名：</label>
              <select id="filterTool">
                <option value="all">すべて</option>
                <option value="詳細評価">詳細評価</option>
                <option value="比較評価">比較評価</option>
                <option value="パーティ評価">パーティ評価</option>
                <option value="Exp算出">Exp算出</option>
                <option value="ねむけパワー算出">ねむけパワー算出</option>
                <option value="Database">データベース</option>
              </select>
            </div>
          </th>
          <th>更新内容</th>
        </tr>
      </thead>
      <tbody id="historyBody"></tbody>
    </table>
  </section>

</main>

<footer class="site-footer">
  <small>© Penkichi Tools</small>
</footer>

<!-- ▼ JS -->
<script src="src/top.js"></script>

</body>
</html>
