  <div class="header-title">Pokémon Sleep Tools</div>

    <span class="menu-line"></span>
    <span class="menu-line"></span>

<!-- ▼ スライドメニュー -->

<div class="overlay" id="overlay"></div>

<h1>詳細評価 ver2.0.0</h1>

<!-- ==================================================
     ▼ 基本情報（折りたたみ）
================================================== -->
<section class="section-block section-basic">
  <h2 class="section-header" data-target="#basicArea">基本情報 <span class="toggle-icon">+</span></h2>
    <div id="basicArea" class="content">

    <!-- ▼ 1行目：ポケモン名・性格・レベル・リボン -->
    <div class="row">

      <div class="field pokemon-field">
        <div id="pokemonDropdown" class="pokemon-dropdown">
          <input id="pokemonInput" type="text" placeholder="ポケモン名を検索…" autocomplete="off">
          <div class="pokemon-options"></div>
        </div>
      </div>

      <div class="field nature-field">
        <div id="natureDropdown" class="nature-dropdown">
          <input id="natureInput" type="text" placeholder="性格を検索…" autocomplete="off">
          <div class="nature-options"></div>
        </div>
      </div>

      <div class="field lv-field">
        <input id="level" type="number" min="1" max="70" placeholder="Lv.（1〜70）">
      </div>

      <div class="field ribbon-field">
        <div class="ribbon-dropdown dropdown-single" id="ribbonDropdown"></div>
      </div>
    </div>

    <!-- ▼ 2行目：食材 -->
    <div class="ingredient-row">

      <div class="ingredient-item">
        <span class="ingredient-label">Lv.1食材</span>
        <select id="ingredientLv1">
          <option value="" disabled selected>ポケモンを選択してください</option>
        </select>
      </div>

      <div class="ingredient-item">
        <span class="ingredient-label">Lv.30食材</span>
        <select id="ingredientLv30">
          <option value="" disabled selected>ポケモンを選択してください</option>
        </select>
      </div>

      <div class="ingredient-item">
        <span class="ingredient-label">Lv.60食材</span>
        <select id="ingredientLv60">
          <option value="" disabled selected>ポケモンを選択してください</option>
        </select>
      </div>

    </div>

    <!-- ▼ 3行目：サブスキル -->
    <div class="row subskill-row">

      <div class="field">
        <div class="subskill-dropdown" id="subskill10">
          <input type="text" class="subskill-input" placeholder="サブスキル（Lv10）">
          <div class="subskill-options"></div>
        </div>
      </div>

      <div class="field">
        <div class="subskill-dropdown" id="subskill25">
          <input type="text" class="subskill-input" placeholder="サブスキル（Lv25）">
          <div class="subskill-options"></div>
        </div>
      </div>

      <div class="field">
        <div class="subskill-dropdown" id="subskill50">
          <input type="text" class="subskill-input" placeholder="サブスキル（Lv50）">
          <div class="subskill-options"></div>
        </div>
      </div>

    </div>

  <!-- ▼ 4行目：サブスキル -->
    <div class="row subskill-row">

      <div class="field">
        <div class="subskill-dropdown" id="subskill70">
          <input type="text" class="subskill-input" placeholder="サブスキル（Lv70）">
          <div class="subskill-options"></div>
        </div>
      </div>

      <div class="field">
        <div class="subskill-dropdown" id="subskill80">
          <input type="text" class="subskill-input" placeholder="サブスキル（Lv80）">
          <div class="subskill-options"></div>
        </div>
      </div>

    </div>

  </div>
</section>

<!-- ==================================================
     ▼ 全体情報（折りたたみ）
================================================== -->
<section class="section-block section-global">
  <h2 class="section-header" data-target="#globalArea">
    全体情報 <span class="toggle-icon">+</span>
  </h2>

  <div id="globalArea" class="content">

    <!-- ▼ 1行目：おてボ・フィールドボーナス・キャンプ -->
    <div class="row">

      <div class="field teambonus-field">
        <div class="teambonus-dropdown dropdown-single" id="teamBonusDropdown"></div>
      </div>

      <div class="field percent-field">
        <input id="fieldBonus" type="number" min="0" max="85" placeholder="フィールドボーナス(初期値：85%)">
        <span class="input-unit">%</span>
      </div>

      <div class="field campticket-field">
        <div class="campticket-dropdown dropdown-single" id="campTicketDropdown"></div>
      </div>

    </div>

    <!-- ▼ 2行目：フィールド・適正・EXボーナス -->
    <div class="row">

      <div class="field">
        <div class="dropdown-single field-dropdown" id="fieldDropdown"></div>
      </div>

      <div class="field">
        <div class="dropdown-single fieldtokui-dropdown" id="fieldTokuiDropdown"></div>
      </div>

      <div class="field">
        <div class="dropdown-single exbonus-dropdown disabled" id="exBonusDropdown"></div>
      </div>

    </div>

  </div>
</section>

<!-- ▼ ボタン -->
<section class="section-block section-buttons">
  <div class="button-row">
    <button id="calcBtn" class="btn-calc">計算する</button>
    <button id="clearBtn" class="btn-clear">設定をクリア</button>
  </div>
</section>

<!-- ▼ 結果表示 -->
<section class="section-block results">
  <h2>結果</h2>
  <div id="summary"></div>
  <div id="tableArea"></div>
</section>

</html>
